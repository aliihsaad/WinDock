<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send to phone · WinDock</title><link rel="stylesheet" href="cast.css"></head>
<body><main>
  <p class="eyebrow">WINDOCK</p><h1>Send a video to your phone</h1>
  <div id="drop" class="drop" tabindex="0" role="button" aria-label="Drop a YouTube link here">
    <strong>Drag a YouTube video here</strong>
    <span>Drag the video’s link or the browser tab’s address from your PC, drop it here, and only the video opens in a small window on your phone.</span>
  </div>
  <form id="form"><input id="link" type="text" inputmode="url" placeholder="…or paste a YouTube link" autocomplete="off" aria-label="YouTube link"><button type="submit">Send</button></form>
  <p id="status" role="status" aria-live="polite">Your phone must be connected to WinDock.</p>
</main><script src="cast.js"></script></body></html>
