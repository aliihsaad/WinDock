name: Build upgraded apps

# Builds the Android APK and the Windows installer for the `upgrades` branch and
# publishes both, plus latest.json, to the rolling `upgrades-latest` pre-release.
# The apps read latest.json to offer one-tap updates.
on:
  push:
    branches: [upgrades]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        # Every build is newer than the last: 0.4.<run> and Android versionCode 1000+<run>.
        run: |
          echo "version=0.4.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test

  android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"'
      - name: Use the shared debug key so each build can update the previous one
        run: |
          mkdir -p ~/.android
          cp android/ci-debug.keystore ~/.android/debug.keystore
      - name: Build APK and run unit tests
        working-directory: android
        run: bash ./gradlew assembleDebug testDebugUnitTest -PwindockVersionName=${{ needs.meta.outputs.version }} -PwindockVersionCode=${{ needs.meta.outputs.code }} --no-daemon --console=plain
      - name: Verify APK and give it a stable name
        run: |
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/WinDock-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-upgraded
          path: artifacts/WinDock-android-debug.apk
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stamp this build's version
        shell: bash
        run: |
          node -e "const fs=require('fs');const v=process.argv[1];const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=v;p.releaseVersion=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');const c='native/tray/WinDockTray.csproj';fs.writeFileSync(c,fs.readFileSync(c,'utf8').replace(/<InformationalVersion>[^<]+<\/InformationalVersion>/,'<InformationalVersion>'+v+'</InformationalVersion>'))" "${{ needs.meta.outputs.version }}"
      - name: Build bundled Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Install verified installer compiler
        shell: pwsh
        run: ./scripts/install-inno.ps1
      - name: Build setup program
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/installer/WinDockSetup.exe
          if-no-files-found: error

  release:
    needs: [meta, web-tests, android, windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-upgraded
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: out
      - name: Write the update feed
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.code }}
        run: |
          cd out
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/upgrades-latest"
          APK_SHA=$(sha256sum WinDock-android-debug.apk | cut -d' ' -f1)
          EXE_SHA=$(sha256sum WinDockSetup.exe | cut -d' ' -f1)
          cat > latest.json <<JSON
          {
            "available": true,
            "version": "${VERSION}",
            "android": { "url": "${BASE}/WinDock-android-debug.apk", "versionName": "${VERSION}", "versionCode": ${CODE}, "sha256": "${APK_SHA}" },
            "windows": { "url": "${BASE}/WinDockSetup.exe", "sha256": "${EXE_SHA}" }
          }
          JSON
          sha256sum WinDock-android-debug.apk WinDockSetup.exe > SHA256SUMS.txt
          cat latest.json
      - name: Publish pre-release with stable download links
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          TAG=upgrades-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" out/WinDock-android-debug.apk out/WinDockSetup.exe out/latest.json out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "WinDock ${VERSION}" \
            --notes "Build ${VERSION} from the upgrades branch. WinDockSetup.exe installs the PC app; WinDock-android-debug.apk is the phone app. The apps update themselves from latest.json."
