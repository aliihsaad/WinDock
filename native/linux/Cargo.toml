[package]
name = "windock-input"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "WinDock Linux touchpad, phone keyboard and signature helper"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
